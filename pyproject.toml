[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmethods"
version = "0.1.0"
description = "MCP server exposing numerical-methods tools: bisection, Simpson 1/3, Runge-Kutta 4, Lagrange interpolation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]==1.14.1",
    "numpy>=1.26.0",
    "sympy>=1.12.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
mathmethods = "mathmethods.server:run"

[tool.setuptools.packages.find]
include = ["mathmethods*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# Vendored math core mirrors the upstream backend (Spanish legacy code) — not linted.
extend-exclude = ["mathmethods/core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# B017: tests deliberately assert blind Exception for invalid inputs.
# BLE001: validation code intentionally catches broad exceptions.
# RUF001/002/003: math symbols (α, β, ×) are intentional in this domain.
ignore = ["B017", "BLE001", "RUF001", "RUF002", "RUF003"]
