name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow the release workflow to gate publishing on a green test run.
  workflow_call:

jobs:
  test:
    # Default install (no `viz`): exercises the registry and the missing
    # matplotlib error path; rendering tests are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q

  viz:
    # With the optional `viz` extra: runs the full plotting suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies (with viz)
        run: uv sync --extra dev --extra viz --frozen

      - name: Tests (plots enabled)
        run: uv run pytest -q
