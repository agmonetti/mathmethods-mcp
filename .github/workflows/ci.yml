name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Verify lockfile is in sync
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
